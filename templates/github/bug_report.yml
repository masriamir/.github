name: Bug report
description: Report a reproducible defect
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, inputs, commands, and logs that reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tool/crate version and toolchain (e.g. rustc)
    validations:
      required: false
