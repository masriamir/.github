# Seed uv config for Python repositories (masriamir/.github,
# templates/python/uv.toml — copied once when setting a repository up, then
# expected to diverge; it is in no manifest).
#
# uv reads this file in preference to a [tool.uv] table in pyproject.toml, which
# is why the table does not appear there. Note the keys here drop the `tool.uv`
# prefix, and [tool.uv.pip] becomes plain [pip].
#
# One uv setting cannot live here: `default-groups` is rejected outright ("only
# applicable in the context of a project"). The seed pyproject.toml therefore
# omits it, which means bare `uv sync` installs the `dev` group only — enough for
# the lefthook pre-commit gates. Use `uv sync --all-groups` to pick up `test`.

# Rebuild the environment when the manifest changes, or when the commit/tags
# move — the latter matters because hatch-vcs derives the version from git.
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } }
]
required-version = ">=0.9.9,<1.0.0"

[pip]
python-version = "3.14"
