# Seed mypy config for Python repositories (masriamir/.github,
# templates/python/mypy.ini — copied once when setting a repository up, then
# expected to diverge; it is in no manifest).
#
# `files` is load-bearing: templates/python/lefthook.yml runs `uv run mypy` with
# no path argument, so this key is what decides the checked scope. Point it at
# the repository's real layout (src/, app/, or top-level packages).
#
# python_version tracks what `uv init` currently pulls in (3.14); set it to match
# the repository's own requires-python.
[mypy]
python_version = 3.14
files = src, tests
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
