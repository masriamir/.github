# Seed ty config for Python repositories (masriamir/.github,
# templates/python/ty.toml — copied once when setting a repository up, then
# expected to diverge; it is in no manifest).
#
# templates/python/lefthook.yml runs `uv run ty check` with no path argument, so
# scope comes from this file. ty is pre-1.0 (0.0.x) and its rule set still moves:
# pin it with an upper bound in the dev dependency group, and expect to add
# [[overrides]] blocks here for framework patterns it cannot yet model (Django
# migrations and DRF attributes are the ones that have needed it so far).
#
# python-version tracks what `uv init` currently pulls in (3.14); set it to match
# the repository's own requires-python.
[environment]
python-version = "3.14"

[src]
respect-ignore-files = true
