# Seed pytest config for Python repositories (masriamir/.github,
# templates/python/pytest.toml — copied once when setting a repository up, then
# expected to diverge; it is in no manifest).
#
# pytest reads exactly ONE config file. This one has the highest precedence of
# the forms in use here, so a sibling pytest.ini or a [tool.pytest.ini_options]
# table in pyproject.toml is silently ignored — pytest reports
# "WARNING: ignoring pytest config in <other file>" and drops every setting in
# it. Keep pytest's configuration here and nowhere else.
#
# Requires pytest 9.0+, which is where pytest.toml was introduced.
[pytest]
testpaths = ["tests"]
