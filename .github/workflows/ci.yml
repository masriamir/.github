name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Conventional-subject validator self-test
        run: sh scripts/test-conventional-subject.sh
      - name: meta_sync self-test
        run: python3 scripts/test_meta_sync.py
