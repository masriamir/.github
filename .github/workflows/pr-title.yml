name: PR Title

# Reusable workflow: validates the calling PR's title as a Conventional Commit.
#
# PRs squash-merge, so the PR title becomes the only commit on `main` and is the
# string the changelog/version tooling parses — lefthook's commit-msg hook checks
# branch commits, which are exactly what squash-merge discards.
#
# The judge is the CALLER's vendored `scripts/check-conventional-subject.py`,
# self-tested here before it judges anything. The meta-check drift gate keeps
# that vendored copy identical to this repository's canonical one on `main` —
# but this workflow (and meta-check itself) runs code from the PR head, so a
# PR that edits the validator, its test, and the manifest together can pass
# its own gate. Accepted for solo-maintained repositories: treat the pair as
# protection against unnoticed drift over time, not as tamper-proof against a
# malicious PR. Hardening option if that ever changes: validate with a trusted
# copy checked out from this repository at the reusable-workflow ref.
#
# Call from a repository with:
#
#   on:
#     pull_request:
#       types: [opened, edited, reopened, ready_for_review, synchronize]
#   jobs:
#     pr-title:
#       uses: masriamir/.github/.github/workflows/pr-title.yml@<pinned sha>
#
# (`edited` catches a retitle; `synchronize` re-attaches the check to each new
# head SHA.)
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Self-test the validator
        run: sh scripts/test-conventional-subject.sh
      - name: Validate PR title
        env:
          # Via the environment, never interpolated into the script: a PR title is
          # attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | python3 scripts/check-conventional-subject.py
