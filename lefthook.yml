# This repository has no compiled code; the hooks gate branch names and commit
# subjects only. Run `lefthook install` once after cloning.
pre-push:
  commands:
    branch-name:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        pattern='^(main|(feature|bugfix|hotfix|docs|chore)/([a-z][a-z0-9_-]*|[0-9][a-z0-9_-]*[a-z][a-z0-9_-]*))$'
        if ! echo "$branch" | grep -qE "$pattern"; then
          echo "Branch '$branch' does not follow naming conventions."
          echo "Use: <type>/<slug> where type is feature|bugfix|hotfix|docs|chore, or main"
          exit 1
        fi

commit-msg:
  commands:
    conventional-commits:
      run: python3 scripts/check-conventional-subject.py < "{1}"
